{% extends "base.html" %}

{% block title %}Log In — PlacePilot{% endblock %}

{% block public_content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card shadow-sm border-0">
        <div class="card-body p-4 p-md-5">
          <div class="text-center mb-4">
            <div class="d-inline-flex p-3 rounded-circle bg-primary bg-opacity-10 text-primary mb-2">
              <i class="bi bi-person-fill fs-3"></i>
            </div>
            <h3 class="fw-bold">Welcome Back</h3>
            <p class="text-muted small">Sign in to your PlacePilot student account</p>
          </div>

          <form action="{{ url_for('login') }}" method="POST">
            <div class="mb-3">
              <label for="email" class="form-label small fw-semibold">Email Address</label>
              <div class="input-group">
                <span class="input-group-text bg-light text-muted"><i class="bi bi-envelope"></i></span>
                <input type="email" class="form-control" id="email" name="email" placeholder="student@college.edu" required autofocus>
              </div>
            </div>

            <div class="mb-4">
              <label for="password" class="form-label small fw-semibold">Password</label>
              <div class="input-group">
                <span class="input-group-text bg-light text-muted"><i class="bi bi-lock"></i></span>
                <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
              </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
              <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
            </button>
          </form>

          <div class="text-center mt-4 small">
            Don't have an account? <a href="{{ url_for('register') }}" class="fw-semibold text-decoration-none">Register here</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
