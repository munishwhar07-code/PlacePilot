{% extends "base.html" %}

{% block title %}Student Registration — PlacePilot{% endblock %}

{% block public_content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card shadow-sm border-0">
        <div class="card-body p-4 p-md-5">
          <div class="text-center mb-4">
            <div class="d-inline-flex p-3 rounded-circle bg-primary bg-opacity-10 text-primary mb-2">
              <i class="bi bi-person-plus-fill fs-3"></i>
            </div>
            <h3 class="fw-bold">Create Student Account</h3>
            <p class="text-muted small">Begin your personalized placement preparation journey</p>
          </div>

          <form action="{{ url_for('register') }}" method="POST">
            <div class="mb-3">
              <label for="name" class="form-label small fw-semibold">Full Name</label>
              <div class="input-group">
                <span class="input-group-text bg-light text-muted"><i class="bi bi-person"></i></span>
                <input type="text" class="form-control" id="name" name="name" placeholder="Munishwhar S" required autofocus>
              </div>
            </div>

            <div class="mb-3">
              <label for="email" class="form-label small fw-semibold">College / Personal Email</label>
              <div class="input-group">
                <span class="input-group-text bg-light text-muted"><i class="bi bi-envelope"></i></span>
                <input type="email" class="form-control" id="email" name="email" placeholder="student@college.edu" required>
              </div>
            </div>

            <div class="mb-3">
              <label for="password" class="form-label small fw-semibold">Password</label>
              <div class="input-group">
                <span class="input-group-text bg-light text-muted"><i class="bi bi-lock"></i></span>
                <input type="password" class="form-control" id="password" name="password" placeholder="At least 6 characters" minlength="6" required>
              </div>
            </div>

            <div class="mb-4">
              <label for="confirm_password" class="form-label small fw-semibold">Confirm Password</label>
              <div class="input-group">
                <span class="input-group-text bg-light text-muted"><i class="bi bi-lock-fill"></i></span>
                <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="Re-enter password" minlength="6" required>
              </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
              <i class="bi bi-arrow-right-circle me-2"></i>Create Account
            </button>
          </form>

          <div class="text-center mt-4 small">
            Already have an account? <a href="{{ url_for('login') }}" class="fw-semibold text-decoration-none">Log in here</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
