{% extends "base.html" %}

{% block title %}Server Error (500) — PlacePilot{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
  <div class="col-md-6 text-center">
    <div class="display-1 fw-bold text-danger mb-2">500</div>
    <h3 class="fw-bold mb-3">Internal Server Error</h3>
    <p class="text-muted mb-4">An unexpected system condition occurred. Please retry or contact your lab administrator.</p>
    <a href="{{ url_for('dashboard') if session.get('user') else url_for('landing') }}" class="btn btn-primary">
      <i class="bi bi-house-door me-1"></i>Return Home
    </a>
  </div>
</div>
{% endblock %}
