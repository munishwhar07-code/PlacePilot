{% extends "base.html" %}

{% block title %}Page Not Found (404) — PlacePilot{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
  <div class="col-md-6 text-center">
    <div class="display-1 fw-bold text-primary mb-2">404</div>
    <h3 class="fw-bold mb-3">Page Not Found</h3>
    <p class="text-muted mb-4">The page or resource you requested could not be located in PlacePilot.</p>
    <a href="{{ url_for('dashboard') if session.get('user') else url_for('landing') }}" class="btn btn-primary">
      <i class="bi bi-house-door me-1"></i>Return Home
    </a>
  </div>
</div>
{% endblock %}
